<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- leaflet css link  -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

  <title>Web-GIS with geoserver and leaflet</title>

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

      .leaflet-control img {
        display: block;
        max-width: none;
        max-height: none;
      }

      .leaflet-control:has(img) {
        height: 300px;
        overflow-y: auto;
        overflow-x: auto;
      }
  </style>
</head>

<body>
  <div id="map"></div>
</body>

</html>

<!-- leaflet js link  -->
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

<!-- jquery link  -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<!-- leaflet geoserver request link  -->
<script src="lib/L.Geoserver.js"></script>

<script>
  var map = L.map("map").setView([-8.35, 122.95], 10);

  var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  });

  osm.addTo(map);

  // wms request
  var wmsLayer1 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
    layers: "pgweb:batas_kecamatan",
    transparent: true,
    attribution: "My wms map of building",
  });
  wmsLayer1.addTo(map);

  var wfsLayer2 = L.Geoserver.wfs(
    "http://localhost:8080/geoserver/wfs",
    {
      layers: "pgweb:jalan",
      style: {
        color: "black",
        weight: 2,
        opacity: 1,
      },
      onEachFeature: function (feature, layer) {
        console.log(feature);

        layer.bindPopup(
          "Nama Jalan: " + feature.properties.NAMA_UNSUR
        );
      },
    }
  );

  wfsLayer2.addTo(map);

  var layerLegend = L.Geoserver.legend("http://localhost:8080/geoserver", {
    layers: "pgweb:batas_kecamatan",
  });

  layerLegend.addTo(map);

  var baseMaps = {
    "OpenStreetMap": osm
  };

  var overlayMaps = {
    "Batas Administrasi Kecamatan": wmsLayer1,
    "Jalan": wfsLayer2
  };

  var layerControl = L.control.layers(
    baseMaps,
    overlayMaps
  ).addTo(map);
</script>
